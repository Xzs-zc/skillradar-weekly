name: skillradar

on:
  schedule:
    # UTC 周日 23:00 = 上海周一 07:00；star-history 按自然周分桶，周一跑正好取到刚结束的完整周
    - cron: '0 23 * * 0'
  workflow_dispatch: {} # 手动补跑

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要 docs/data 历史做 30 天冷却去重
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build weekly digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }} # 可选，默认 deepseek-v4-flash
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }} # 可选，默认 https://api.deepseek.com
        run: node scripts/build.mjs
      - name: Commit docs
        run: |
          git add docs
          git diff --cached --quiet || git commit -m "docs: weekly codex skill digest $(TZ=Asia/Shanghai date +%F)"
          git push
